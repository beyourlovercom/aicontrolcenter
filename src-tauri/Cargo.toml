[package]
name = "ai-control-center"
version = "0.2.0"
description = "Governed AI project control center"
authors = ["beyourlovercom"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
