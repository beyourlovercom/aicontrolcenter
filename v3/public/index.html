<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AICC V3</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header><div class="mark">A</div><div><h1>AI Control Center</h1><p>V3 · Single Authority</p></div></header>
    <section class="banner" id="banner">正在读取唯一 ProjectContext…</section>
    <section class="grid" id="facts" hidden>
      <article><span>Project</span><strong id="project"></strong></article>
      <article><span>Repository</span><strong id="repository"></strong></article>
      <article><span>Branch</span><strong id="branch"></strong></article>
      <article><span>HEAD</span><strong id="head"></strong></article>
      <article><span>Worktree</span><strong id="dirty"></strong></article>
      <article><span>Authority</span><strong>ONE PROJECT CONTEXT</strong></article>
    </section>
    <section class="roadmap" id="roadmap" hidden>
      <div class="roadmap-status" id="roadmap-status">正在读取 canonical Roadmap…</div>
      <div class="section-heading"><div><span>Canonical Roadmap</span><h2>当前执行焦点</h2></div><strong id="roadmap-revision"></strong></div>
      <div class="current-grid">
        <article><span>Milestone</span><strong id="current-milestone"></strong></article>
        <article><span>Work Package</span><strong id="current-wp"></strong></article>
        <article><span>Phase</span><strong id="current-phase"></strong></article>
      </div>
      <div class="roadmap-meta" id="roadmap-authority"></div>
      <div class="milestone-list" id="milestone-list"></div>
    </section>
    <footer>V3.3 · canonical Roadmap · no V2 fallback · no browser inference</footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
