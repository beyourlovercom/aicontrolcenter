<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AICC V4</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">A</span><div><strong>AICC</strong><small>GitHub-backed Development Dashboard</small></div></div>
      <div class="top-actions">
        <button id="refreshButton" class="ghost-button" type="button">Refresh GitHub</button>
        <button id="contextButton" class="context-button" type="button" disabled>✦ GPT Context</button>
        <button id="runtimeButton" class="runtime-button" type="button" aria-label="Runtime Overview"><span>●</span><b id="runtimeCount">0</b></button>
        <button id="attentionButton" class="attention-button" type="button" aria-label="Owner Attention"><span>⚠</span><b id="attentionCount">0</b></button>
        <div class="switcher" id="switcher">
          <button id="switcherButton" class="switcher-button" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="switcherLabel">All Projects</span><span class="chevron">⌄</span>
          </button>
          <div id="switcherMenu" class="switcher-menu" role="listbox" hidden></div>
        </div>
      </div>
    </header>
    <main id="main" class="main-content" aria-live="polite"></main>
    <footer id="statusbar" class="statusbar">GitHub source · loading…</footer>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
