name: Build macOS visible app

on:
  push:
    branches: [feature/aicc-visible-app-v0-2]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Build unsigned macOS app bundle
        run: npm run tauri build -- --bundles app --no-sign

      - name: Apply ad-hoc code signature and verify bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/release/bundle/macos/AI Control Center.app"
          test -d "$APP_PATH"
          xattr -cr "$APP_PATH"
          codesign --force --deep --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee codesign-details.txt

      - name: Package signed app and DMG
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/release/bundle/macos/AI Control Center.app"
          OUT_DIR="$RUNNER_TEMP/aicc-dist"
          STAGE_DIR="$RUNNER_TEMP/aicc-dmg-stage"
          mkdir -p "$OUT_DIR" "$STAGE_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT_DIR/AI-Control-Center-v0.2.0-macOS-arm64-adhoc-APP.zip"
          ditto "$APP_PATH" "$STAGE_DIR/AI Control Center.app"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create \
            -volname "AI Control Center" \
            -srcfolder "$STAGE_DIR" \
            -ov \
            -format UDZO \
            "$OUT_DIR/AI-Control-Center-v0.2.0-macOS-arm64-adhoc.dmg"
          shasum -a 256 "$OUT_DIR"/* | tee "$OUT_DIR/SHA256SUMS.txt"
          cp codesign-details.txt "$OUT_DIR/codesign-details.txt"

      - name: Upload ad-hoc signed macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: ai-control-center-macos-arm64-adhoc
          path: ${{ runner.temp }}/aicc-dist/*
          if-no-files-found: error
          retention-days: 30
