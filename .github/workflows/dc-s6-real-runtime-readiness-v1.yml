name: DC S6 Real Runtime Preflight Audit V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/byl-remote-mcp/remote-v6-real-readiness-audit.mjs'
      - 'scripts/byl-remote-mcp/remote-v6-real-readiness-audit.test.mjs'
      - '.github/workflows/dc-s6-real-runtime-readiness-v1.yml'
      - 'docs/60_Operations/work-packages/AICC-DC-S6-REAL-SIGNED-READINESS-V1.md'
permissions:
  contents: read
jobs:
  classified-control-vs-cryptographic-health:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, fail-closed readiness cases and existing signed-health regression
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/byl-remote-mcp/remote-v6-real-readiness-audit.mjs
          node --check scripts/byl-remote-mcp/remote-v6-real-readiness-audit.test.mjs
          node --test \
            scripts/byl-remote-mcp/remote-v6-real-readiness-audit.test.mjs \
            scripts/byl-remote-mcp/remote-v2-verified-availability.test.mjs \
            scripts/byl-remote-mcp/remote-v2-signed-health.test.mjs \
            scripts/byl-remote-mcp/remote-v2-live-health.test.mjs
      - name: No direct network, shell, file IO or hidden release override in source
        shell: bash
        run: |
          set -euo pipefail
          target=scripts/byl-remote-mcp/remote-v6-real-readiness-audit.mjs
          if grep -En 'node:fs|node:net|node:http|node:child_process|fetch\(|exec\(|spawn\(|readFile|writeFile|launchctl|privateKey|\.env|gateway\.token' "$target"; then
            echo 'Forbidden runtime/secret effect in read-only preflight'; exit 1
          fi
          grep -q 'canDeploy:false' "$target"
          grep -q 'canReplaceStaticReady:false' "$target"
          grep -q 'STATIC_READY' /dev/null 2>/dev/null || true
