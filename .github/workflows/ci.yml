name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate OpenSpec changes
        run: npx --no-install openspec validate --all --strict --no-interactive
      - name: Scan for secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|BEGIN [A-Z ]*PRIVATE KEY)' -- .github docs openspec ':!package-lock.json'; then
            echo 'Potential secret detected'
            exit 1
          fi
      - name: Scan for absolute local paths
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(/Users/|/home/|[A-Za-z]:\\\\Users\\\\)' -- .github docs openspec ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo 'Absolute local path detected'
            exit 1
          fi
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Generate Tauri icons
        run: npm run pretauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Rust contract test list
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --list
